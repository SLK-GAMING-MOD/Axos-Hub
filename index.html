<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SLK-GAMING-MOD | Scripts & Projects</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Outfit:wght@400;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="bg-grid"></div>

    <nav class="navbar">
        <div class="nav-logo">
            <span class="logo-mark">&lt;/&gt;</span>
            <span class="logo-text">SLK_GAMING</span>
        </div>
        <div class="nav-status">
            <span class="status-dot"></span>
            Admin Online
        </div>
    </nav>

    <header class="hero">
        <div class="hero-badge silk-reveal">SYSTEM ACTIVATED</div>
        <h1 class="silk-reveal">Kho Lưu Trữ <span>Script & Tool</span></h1>
        <p class="hero-sub silk-reveal">Nơi chia sẻ các dự án, UI Hub và script cá nhân. Mọi luồng dữ liệu đều được quản lý độc quyền.</p>
    </header>

    <main class="container">
        <div class="search-wrap silk-reveal">
            <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <input type="text" id="search-input" class="search-input" placeholder="Tìm script, hub, tool...">
            <button id="search-clear" class="search-clear" title="Xoá tìm kiếm">&times;</button>
        </div>
        <p id="search-empty" class="search-empty" style="display:none;">Không tìm thấy script nào khớp với từ khoá của bạn.</p>
        <div id="card-container" class="card-grid"></div>
    </main>

    <footer>
        <p>&copy; 2026 Coded by SLK-GAMING-MOD. Hosted on GitHub Pages.</p>
    </footer>

    <script src="data.js"></script>
    <script src="app.js"></script>

</html>
